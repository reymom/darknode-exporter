# Drop-in for darkfid.service — give sled time to flush on stop.
# Install: /etc/systemd/system/darkfid.service.d/timeout.conf
#
# 2026-07-16 01:21: a stop hit systemd's default 90s timeout and the sled-io
# threads were SIGKILLed mid-write — the exact corruption scenario from the
# blog post §6. The memguard watchdog's restart goes through this same stop
# path, so the two protections stack: watchdog picks WHEN, this grants HOW LONG.
[Service]
TimeoutStopSec=300
