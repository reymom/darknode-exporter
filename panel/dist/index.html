<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>darkscope</title>
<style>
  :root { --bg:#000; --plate:#0a0c0e; --ink:#e3e7ea; --dim:#8b939c; --faint:#4a5057; --line:#1f2328;
          --mono: ui-monospace,"DejaVu Sans Mono",SFMono-Regular,Menlo,monospace; }
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--mono)}
  body{display:flex;flex-direction:column}
  header{display:flex;gap:18px;align-items:flex-start;padding:16px 20px;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
  .brand h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.02em}
  .brand span{font-size:12px;color:var(--faint)}
  #cards{display:flex;gap:16px;flex-wrap:wrap}
  .card{background:var(--plate);border:1px solid var(--line);padding:12px 16px;min-width:290px}
  .card .hd{display:flex;align-items:center;gap:8px;font-size:14px}
  .card .hd .age{margin-left:auto;font-size:11px;color:var(--faint)}
  .card .hd .desc{font-size:11px;color:var(--faint);margin-left:8px}
  .card .dot{width:9px;height:9px;border-radius:2px;display:inline-block}
  .card dl{display:flex;gap:20px;margin:10px 0 0}
  .card dl div{display:flex;flex-direction:column}
  .card dt{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .card dd{margin:0;font-size:18px;line-height:1.25}
  .card dfn{font-style:normal;font-size:10px;color:var(--faint)}
  main{flex:1;min-height:0;position:relative}
  #net{position:absolute;inset:0}
  #note{position:absolute;left:20px;bottom:16px;font-size:11px;line-height:1.7;color:#3a4047}
  #note b{color:var(--dim);font-weight:600}
  #mix{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--dim)}
  #mix b{color:var(--ink);font-weight:600;margin-right:12px}
  #mix .sw{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
  #mix .sw.discovery{background:#2b9fd9}#mix .sw.keepalive{background:#7d828a}
  #mix .sw.chain{background:#d9489c}#mix .sw.tx{background:#e06c00}
  #mix .tot{margin-left:auto;color:var(--faint)}
</style>
  <script type="module" crossorigin src="/assets/index-BWu2NTwo.js"></script>
</head>
<body>
<header>
  <div class="brand"><h1>darkscope</h1><span>your nodes, from their own debug feed</span></div>
  <div id="cards"></div>
</header>
<main>
  <div id="net"></div>
  <div id="note">
    events and their times <b>real</b> · how long a dot takes to cross <b>drawn</b> · the feed plays <b>2 s</b> behind<br>
    peers are pseudonyms — this page never receives an address
  </div>
</main>
<div id="mix"></div>
</body>
</html>
